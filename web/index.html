    <style>
      :root {
        --primary: #0F0F12;
        --card-bg: #1A1A22;
        --accent: #EAB64A;
        --mint: #67D4A8;
        --bg: #09090C;
        --text: #E1E7ED;
        --text-muted: #94A3B8;
        --border: #2D2D3B;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 0;
        line-height: 1.6;
      }

      header {
        background-color: var(--primary);
        color: white;
        padding: 24px 0;
        text-align: center;
        border-bottom: 1px solid var(--border);
      }

      .logo {
        font-size: 28px;
        font-weight: 900;
        letter-spacing: 1px;
      }

      .logo span {
        color: var(--accent);
      }

      .container {
        max-width: 850px;
        margin: 30px auto;
        padding: 0 20px;
      }

      .lang-picker {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 25px;
        flex-wrap: wrap;
      }

      .lang-btn {
        background: var(--card-bg);
        border: 1px solid var(--border);
        padding: 8px 14px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.2s;
        color: var(--text-muted);
      }

      .lang-btn.active {
        background: var(--mint);
        color: #000;
        border-color: var(--mint);
        font-weight: 700;
      }

      .nav-tabs {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 20px;
      }

      .tab-btn {
        padding: 12px 24px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--card-bg);
        font-weight: 700;
        color: var(--text-muted);
        cursor: pointer;
      }

      .tab-btn.active {
        background: var(--accent);
        color: #000;
        border-color: var(--accent);
      }

      .card {
        background: var(--card-bg);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        border: 1px solid var(--border);
      }

      h1 {
        font-size: 24px;
        color: var(--accent);
        margin-top: 0;
        margin-bottom: 20px;
        font-weight: 900;
      }

      h2 {
        font-size: 18px;
        color: var(--mint);
        margin-top: 30px;
        font-weight: 700;
      }

      p, li {
        font-size: 14px;
        color: var(--text);
      }

      footer {
        text-align: center;
        padding: 30px 20px;
        font-size: 12px;
        color: var(--text-muted);
        border-top: 1px solid var(--border);
        margin-top: 50px;
        background-color: var(--primary);
      }

      footer p {
        margin: 4px 0;
        font-size: 12px;
        color: var(--text-muted);
      }
    </style>

      let currentLang = "pt-BR";
      let currentTab = "termos";

      function init() {
        const urlParams = new URLSearchParams(window.location.search);
        const langParam = urlParams.get("lang");
        const pathParam = window.location.pathname;

        if (langParam && LEGAL_DATA[langParam]) {
          currentLang = langParam;
        }

        if (pathParam.includes("privacidade")) {
          currentTab = "privacidade";
        } else if (pathParam.includes("termos")) {
          currentTab = "termos";
        }

        render();
      }

      function setLanguage(lang) {
        currentLang = LEGAL_DATA[lang] ? lang : "en";
        render();
      }

      function switchTab(tab) {
        currentTab = tab;
        render();
      }

      function render() {
        const langData = LEGAL_DATA[currentLang] || LEGAL_DATA["en"];

        document.querySelectorAll(".lang-btn").forEach((btn) => {
          btn.classList.remove("active");
          if (btn.getAttribute("onclick").includes(currentLang)) {
            btn.classList.add("active");
          }
        });

        document.getElementById("btn-termos").innerText = langData.tabTermos;
        document.getElementById("btn-privacidade").innerText = langData.tabPrivacidade;

        document.getElementById("btn-termos").className = `tab-btn ${currentTab === "termos" ? "active" : ""}`;
        document.getElementById("btn-privacidade").className = `tab-btn ${currentTab === "privacidade" ? "active" : ""}`;

        document.getElementById("content-box").innerHTML = currentTab === "termos" ? langData.termos : langData.privacidade;
      }

      window.onload = init;
